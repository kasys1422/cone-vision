<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff7a00" />
    <title>Cone Vision</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-wrap">
          <div class="brand-icon" aria-hidden="true">
            <svg
              viewBox="0 0 32 32"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="m9 25 6-21h2l6 21M7 25h18v4H7Z" />
              <path d="M13 11h6M11 18h10" />
            </svg>
          </div>
          <div>
            <h1>Cone Vision</h1>
          </div>
        </div>
        <button id="installButton" class="ghost-button hidden">
          インストール
        </button>
      </header>

      <main>
        <section id="homeScreen" class="screen active">
          <div class="action-stack">
            <button id="openCameraButton" class="primary-button big-button">
              <span class="action-icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 32 32"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <path
                    d="M11 8 13 5h6l2 3h5a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3Z"
                  />
                  <circle cx="16" cy="17" r="6" /></svg></span
              ><span>撮影する</span><span aria-hidden="true">↗</span>
            </button>
            <label class="secondary-button big-button upload-label">
              <span class="action-icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 32 32"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                >
                  <rect x="3" y="4" width="26" height="24" rx="3" />
                  <circle cx="11" cy="12" r="3" />
                  <path d="m4 24 8-8 6 6 4-4 7 7" /></svg></span
              ><span>画像を選ぶ</span><span aria-hidden="true">＋</span>
              <input id="imageInput" type="file" accept="image/*" />
            </label>
          </div>
          <section class="model-storage" aria-label="モデルデータ">
            <div><strong>端末のモデルデータ</strong><p id="modelStatus" role="status"></p></div>
            <button id="deleteModels" class="ghost-button small" type="button" disabled>保存データを削除</button>
          </section>
          <details class="settings-card">
            <summary>モデル・コーンの寸法・カメラ設定</summary>
            <div class="settings-grid">
              <label
                >コーン高さ [m]
                <input
                  id="coneHeightInput" value="0.700"
                  type="number"
                  min="0.1"
                  step="0.001"
                />
              </label>
              <label
                >台座幅 [m]
                <input
                  id="baseWidthInput" value="0.364"
                  type="number"
                  min="0.1"
                  step="0.001"
                />
              </label>
              <label
                >水平画角 [°]
                <input
                  id="fovInput"
                  type="number"
                  min="4"
                  max="175"
                  step="0.01"
                  value="60"
                />
              </label>
              <label>検出モデル
                <select id="detectorProfile">
                  <option value="fcos_r50" selected>FCOS ResNet-50（標準）</option>
                  <option value="fcos_r18">FCOS ResNet-18（中間）</option>
                  <option value="v12_default">YOLOX-Nano（軽量）</option>
                  <option value="v12_mixed">SSDLite</option>
                </select>
              </label>
              <label>3D用の深度モデル<select id="depthProfile"></select></label>
              <label
                >検出しきい値
                <input
                  id="thresholdInput"
                  type="range"
                  min="0.05"
                  max="0.9"
                  step="0.01"
                  value="0.65"
                />
                <output id="thresholdLabel">0.65</output>
              </label>
              <label class="checkbox-row"
                ><input id="useWebGPUInput" type="checkbox" checked />
                WebGPUを優先</label
              >
              <label class="checkbox-row"
                ><input id="refineRoiInput" type="checkbox" />
                ROI再推定（実験）</label
              >
              <label
                >カメラ校正JSON
                <input
                  id="cameraJsonInput"
                  type="file"
                  accept=".json,application/json"
                />
              </label>
            </div>
          </details>
        </section>

        <section id="captureScreen" class="screen">
          <div class="topbar">
            <button
              class="icon-button"
              aria-label="ホームへ戻る"
              data-back="home"
            >
              ←
            </button>
            <div>
              <div class="topbar-title">撮影</div>
            </div>
          </div>
          <div class="preview-card camera-card">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="cameraCanvas" class="hidden"></canvas>
            <div class="guide-frame"></div>
          </div>
          <div class="camera-controls">
            <button id="closeCameraButton" class="secondary-button">
              キャンセル
            </button>
            <button
              id="captureButton"
              class="capture-button"
              aria-label="写真を撮る"
            ></button>
            <button id="switchCameraButton" class="secondary-button">
              切替
            </button>
          </div>
        </section>

        <section id="reviewScreen" class="screen">
          <div class="topbar">
            <button
              class="icon-button"
              aria-label="ホームへ戻る"
              data-back="home"
            >
              ←
            </button>
            <div>
              <div class="topbar-title">写真を確認</div>
            </div>
          </div>
          <div class="preview-card">
            <canvas id="reviewCanvas"></canvas>
          </div>
          <p id="scanHint" class="scan-hint"></p>
          <div class="review-fov">
            <label
              >水平画角
              <input
                id="reviewFovInput"
                type="number"
                min="4"
                max="175"
                step="0.01"
                value="60"
              />
              °</label>
            <button id="useExifFovButton" class="ghost-button small hidden" type="button">写真の画角に戻す</button>
          </div>
          <div class="review-actions">
            <button id="retakeButton" class="secondary-button hidden">撮り直し</button>
            <button id="scanButton" class="primary-button">スキャンする</button>
          </div>
        </section>

        <section id="resultScreen" class="screen">
          <div class="topbar">
            <button
              class="icon-button"
              aria-label="写真の確認へ戻る"
              data-back="review"
            >
              ←
            </button>
            <div>
              <div class="topbar-title">解析結果</div>
              <div
                id="resultSubtitle"
                class="sr-only"
                role="status"
                aria-live="polite"
              ></div>
            </div>
            <button id="rescanButton" class="ghost-button small">
              再スキャン
            </button>
          </div>
          <div class="preview-card result-card">
            <canvas id="resultCanvas"></canvas>
            <div id="regionFrame" class="hidden" aria-hidden="true"></div>
            <div class="region-tools">
              <button id="openCloud" type="button" class="primary-button hidden">3Dで見る</button>
              <button id="chooseRegion" type="button" class="secondary-button">範囲を選んで再検出</button>
              <button id="cancelRegion" type="button" class="ghost-button hidden">キャンセル</button>
              <p id="regionStatus" role="status"></p>
            </div>
          </div>
          <div class="bottom-sheet">
            <section class="selection-panel">
              <div class="panel-header">
                <h3>検出されたコーン <span id="objectCountBadge" class="count-badge">0</span></h3>
                <button id="saveResultButton" type="button" class="ghost-button small">結果JSON保存</button>
              </div>
              <div id="coneList" class="cone-list empty">
                まだ解析していません
              </div>
              <button id="undoRemoveCone" type="button" class="ghost-button small hidden">削除を取り消す</button>
            </section>
            <section id="detailPanel" class="detail-panel hidden">
              <div class="panel-header">
                <h3 id="selectedConeTitle">コーン</h3>
                <button id="removeCone" type="button" class="secondary-button">このコーンを削除</button>
              </div>
              <div class="metric-grid">
                <div class="metric-item distance-metric">
                  <span>コーンまでの距離</span
                  ><strong id="distanceValue">—</strong>
                </div>
                <div class="metric-item">
                  <span>奥行き</span><strong id="depthValue">—</strong>
                </div>
                <div class="metric-item">
                  <span>検出スコア</span><strong id="confidenceValue">—</strong>
                </div>
              </div>
            </section>
          </div>
        </section>
        <section id="cloudScreen" class="screen">
          <div class="topbar">
            <button class="icon-button" aria-label="解析結果へ戻る" data-back="result">←</button>
            <h2 class="topbar-title">奥行き解析</h2>
            <button id="saveLas" class="ghost-button">LASを保存</button>
          </div>
          <div class="depth-views" role="group" aria-label="表示の切り替え">
            <button id="viewPoints" type="button" aria-controls="pointPanel" aria-pressed="true">カラー点群</button>
            <button id="viewDepth" type="button" aria-controls="depthPanel" aria-pressed="false">距離画像</button>
            <button id="viewColor" type="button" aria-controls="colorPanel" aria-pressed="false">カラー画像</button>
          </div>
          <div class="cloud-stage" id="pointPanel">
            <canvas id="cloudCanvas" tabindex="0" title="ドラッグで回転、2本指スワイプ・中ボタンドラッグで水平移動、ピンチ・ホイールで拡大縮小" aria-label="カラー点群。1本指または左ドラッグで回転、2本指スワイプまたは中ボタンドラッグで水平移動、ピンチまたはホイールで拡大縮小。矢印キーとプラス・マイナスキーでも操作できます。"></canvas>
            <p id="cloudViewStatus" class="hidden" role="status"></p>
          </div>
          <div id="depthPanel" class="hidden">
            <canvas id="depthCanvas" aria-label="コーンで補正した奥行きの距離画像"></canvas>
            <div class="depth-legend">
              <div id="depthScale"></div>
              <div class="depth-labels"><span>近 · 0 m</span><span id="midDepth"></span><span id="farDepth"></span></div>
              <span class="depth-missing">範囲外・無効</span>
            </div>
          </div>
          <div id="colorPanel" class="hidden">
            <canvas id="colorCanvas" aria-label="深度推定に使ったカラー画像"></canvas>
          </div>
          <div class="cloud-tools">
            <label>深度モデル <select id="cloudProfile"></select></label>
            <label id="gridControl"><input id="cloudGrid" type="checkbox" checked /> 1 m グリッド</label>
            <button id="resetCloud" class="secondary-button">視点を戻す</button>
          </div>
          <p class="scan-hint" id="cloudInfo"></p>
        </section>
      </main>
    </div>

    <dialog id="scanDialog" aria-labelledby="workTitle" aria-describedby="workDetail">
      <div class="work-status"><span class="spinner" aria-hidden="true"></span><h2 id="workTitle"></h2></div>
      <p id="workDetail" role="status"></p>
      <progress id="transferProgress" aria-label="ダウンロード進捗" class="hidden"></progress>
      <div id="downloadActions" class="hidden">
        <button id="approveDownload" type="button" class="primary-button">モデルをダウンロード</button>
        <button id="cancelDownload" type="button" class="ghost-button small">キャンセル</button>
      </div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.js"></script>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
