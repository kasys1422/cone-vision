name: Deploy Cone Vision to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cone-vision-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Stage site with depth models from GitHub Releases
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"
          python3 scripts/fetch_depth_models.py "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish site
        id: deploy
        uses: actions/deploy-pages@v4
