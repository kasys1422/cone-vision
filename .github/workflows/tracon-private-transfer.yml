name: TraCon encrypted research transfer
on:
  push:
    branches: [experiment/tracon-v9-20261105]
    paths: [.github/workflows/tracon-private-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned public dataset and encrypt for local review
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install cryptography
          python - <<'PY'
          import os, pathlib, urllib.request, hashlib, json
          from cryptography.hazmat.primitives.serialization import load_pem_public_key
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          commit = '7ac4af371e826b5124a9b4defaa3327bc817817e'
          url = f'https://codeload.github.com/ikatsamenis/Cone-Detection/zip/{commit}'
          request = urllib.request.Request(url, headers={'User-Agent':'ConeVision-research'})
          with urllib.request.urlopen(request, timeout=180) as r:
              raw = r.read()
          public = b'''-----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA1IxywT0Z/abCNdQwzO0y
          zLB4aorVqqPIHJRLYxb4wHMEzhCeRTsI2VBuRL1kH77yyBuDGRmKqYhI3VqNmIcv
          lYSsilKyha4BxJa3jGqFKfs6RSlmiErecOXQEJZZP4q57Mt+rqRvl8RyulniGQHq
          VVe29V0GWjVhUofKf9RIvLUUs5HnzJ6UOKMKT8iR/X8+8RvrpAV8VUPqr5wl7vAW
          Ky/rqRfdkquA6IFnUMsrHQqgps1UFmp86+81e2gBhU35RCfnRbM62grgTVpmBEFU
          m8XDDWA4eoeLAVpSTG5WXoFnQv5a7Hr+0rt1T4/6qdhyeq5utxJvEkqr3EdZ+1TF
          oAhYw0bkJOpLieERLtt+7VKcTtncDplCm8BnKKFQZytEQG1AWmS5A1NJawJVVBxT
          uFhyDJl/7gxxn+LUG55iqcPM9mDKs7g9mVJX9gf/+9T0yqNvxZK+gdsoI/GV2YgE
          EEe6mVTTQlqzwuXjRJGHewpTAZ0EcPckEUrgPLseafjzAgMBAAE=
          -----END PUBLIC KEY-----'''
          public = b'\n'.join(line.strip() for line in public.splitlines())
          key = os.urandom(32); nonce = os.urandom(12)
          encrypted_key = load_pem_public_key(public).encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          ciphertext = AESGCM(key).encrypt(nonce,raw,commit.encode())
          out=pathlib.Path('encrypted');out.mkdir()
          (out/'source.enc').write_bytes(ciphertext)
          (out/'key.enc').write_bytes(encrypted_key)
          (out/'metadata.json').write_text(json.dumps({'commit':commit,'nonce_hex':nonce.hex(),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'source':url,'note':'Encrypted for the research session only. No plaintext dataset is uploaded.'},indent=2))
          print(f'Encrypted source archive: {len(raw)} bytes. Plaintext is not an artifact.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tracon-encrypted-source
          path: encrypted/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
